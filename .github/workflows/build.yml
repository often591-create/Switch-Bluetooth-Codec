name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          set -o pipefail
          {
            set -x
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/cmdline-tools" || true
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            (yes | "$SDKM" --licenses > /dev/null) || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
            base64 -d keystore.b64 > app/release.keystore
            curl -sSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BtCodecSwitch.apk
          gh release create "v${{ github.run_number }}" BtCodecSwitch.apk \
            --title "蓝牙编码切换 v${{ github.run_number }}" \
            --notes "在手机上下载 BtCodecSwitch.apk 安装即可。" --latest

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            if [ -f build.log ]; then
              grep -n -E "error:|What went wrong|FAILURE" -A8 build.log | head -c 30000
              echo "----- last lines -----"
              tail -n 120 build.log | tail -c 25000
            else
              echo "No build.log: failed before the build step."
            fi
            echo '```'
          } > report.md
          gh issue create --title "Build failed #${{ github.run_number }}" --body-file report.md
